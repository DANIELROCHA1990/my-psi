name: Keep Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [[ -z "$KEEP_ALIVE_URL" || ! "$KEEP_ALIVE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "KEEP_ALIVE_URL is missing or invalid. Set it to the HTTPS Supabase keep-alive function URL in repository Actions secrets."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 "$KEEP_ALIVE_URL"